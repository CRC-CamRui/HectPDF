<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador Héctor Ruiz</title>

    <meta name="theme-color" content="#16a34a">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cuentas Héctor">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }

        #factura-template {
            width: 21.59cm;
            min-height: 27.94cm;
            padding: 1.0cm;
            background: white;
            font-family: 'Arial', sans-serif;
            line-height: 1.0;
            color: black;
            font-size: 12px;
        }

        #factura-template .text-2xl {
            font-size: 1.0rem !important;
        }

        #factura-template .text-lg {
            font-size: 0.95rem !important;
        }

        #factura-template .text-md {
            font-size: 0.85rem !important;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body class="bg-gray-100 p-4 pb-20">

    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-xl border border-gray-200">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">Datos de la Cuenta</h2>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Empresa / Cliente</label>
                <input type="text" id="input-empresa" placeholder="Ej: AVIACOL S.A.S."
                    class="w-full border-gray-300 border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">NIT</label>
                <input type="text" id="input-nit" placeholder="900.000.000-0"
                    class="w-full border-gray-300 border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <hr class="my-4">

            <div class="space-y-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Conceptos de Cobro</label>

                <div id="filas-conceptos" class="space-y-3">
                    <div class="flex gap-2 items-start concepto-item">
                        <input type="text" placeholder="Descripción"
                            class="desc-concepto w-2/3 border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <input type="number" placeholder="Valor"
                            class="val-concepto w-1/3 border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <button onclick="eliminarFila(this)"
                            class="p-3 text-red-500 hover:bg-red-50 rounded-lg">✕</button>
                    </div>
                </div>

                <button onclick="agregarFila()"
                    class="w-full py-2 border-2 border-dashed border-blue-400 text-blue-600 font-semibold rounded-xl hover:bg-blue-50 transition-colors">
                    + Agregar otro concepto
                </button>
            </div>

            <button onclick="generarPDF()"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform active:scale-95 mt-6">
                📄 Generar Cuenta de Cobro
            </button>
        </div>
    </div>

    <div id="pdf-container" class="hidden">
        <div id="factura-template">
            <div class="text-center font-bold text-2xl mb-8 tracking-widest">CUENTA DE COBRO</div>

            <div class="text-right mb-10" id="fecha-actual"></div>

            <div class="mb-8">
                <div class="font-bold text-lg" id="text-empresa"></div>
                <div id="text-nit" class="text-md"></div>
            </div>

            <div class="mb-4 font-bold text-lg italic">DEBE A:</div>
            <div class="text-lg" id="pdf-nombre-emisor"></div>
            <div class="mb-10 text-lg" id="pdf-cc-emisor"></div>

            <div class="mb-8 text-lg leading-relaxed">
                LA SUMA DE: <span id="text-total-letras" class="font-bold"></span>
                (<span id="text-total-numero" class="font-bold"></span>)
            </div>

            <div class="mb-4 text-lg">POR CONCEPTO DE:</div>

            <table class="w-full border-collapse border border-black mb-12">
                <tbody id="tabla-body" class="text-base">
                </tbody>
            </table>

            <div class="text-md mb-20 italic bg-gray-50 p-4 border border-gray-200 rounded" id="pdf-banco-emisor">
            </div>

                <!-- Contenedor de la firma -->

    <script>
        // Funciones de la tabla dinámica
        function agregarFila() {
            const contenedor = document.getElementById('filas-conceptos');
            const nuevaFila = document.createElement('div');
            nuevaFila.className = 'flex gap-2 items-start concepto-item';
            nuevaFila.innerHTML = `
            <input type="text" placeholder="Descripción" class="desc-concepto w-2/3 border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="number" placeholder="Valor" class="val-concepto w-1/3 border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="eliminarFila(this)" class="p-3 text-red-500 hover:bg-red-50 rounded-lg">✕</button>
            `;
            contenedor.appendChild(nuevaFila);
        }

        function eliminarFila(boton) {
            const filas = document.querySelectorAll('.concepto-item');
            if (filas.length > 1) {
                boton.parentElement.remove();
            } else {
                alert("Debes tener al menos un concepto en la cuenta.");
            }
        }

        // Convertir números a letras
        function numeroALetras(num) {
            const unidades = ['', 'UN', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE'];
            const decenas = ['DIEZ', 'ONCE', 'DOCE', 'TRECE', 'CATORCE', 'QUINCE', 'DIECISEIS', 'DIECISIETE', 'DIECIOCHO', 'DIECINUEVE'];
            const decenas2 = ['', '', 'VEINTE', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
            const centenas = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];

            function convertirSeccion(n) {
                let output = '';
                if (n === 100) return 'CIEN ';
                if (n > 100) output += centenas[Math.floor(n / 100)] + ' ';
                let resto = n % 100;
                if (resto > 0) {
                    if (resto < 10) output += unidades[resto] + ' ';
                    else if (resto < 20) output += decenas[resto - 10] + ' ';
                    else {
                        output += decenas2[Math.floor(resto / 10)] + (resto % 10 > 0 ? ' Y ' + unidades[resto % 10] : '') + ' ';
                    }
                }
                return output;
            }

            if (num === 0) return 'CERO PESOS';
            let millones = Math.floor(num / 1000000);
            let miles = Math.floor((num % 1000000) / 1000);
            let cienes = num % 1000;

            let resultado = '';
            if (millones > 0) resultado += (millones === 1 ? 'UN MILLÓN ' : convertirSeccion(millones) + 'MILLONES ');
            if (miles > 0) resultado += (miles === 1 ? 'MIL ' : convertirSeccion(miles) + 'MIL ');
            if (cienes > 0) resultado += convertirSeccion(cienes);

            return resultado.trim() + ' PESOS M/CTE';
        }

        // Generar el PDF final
        function generarPDF() {
            // 1. Datos fijos de Héctor
            const nombreEmisor = "HECTOR RUIZ CARDENAS";
            const ccEmisor = "79.129.797";
            const bancoEmisor = "Banco Caja Social No. 245 2133 7065";

            // 2. Capturar datos del formulario
            const empresa = document.getElementById('input-empresa').value || '';
            const nit = document.getElementById('input-nit').value || '';
            const descs = document.querySelectorAll('.desc-concepto');
            const vals = document.querySelectorAll('.val-concepto');

            // 3. Inyectar datos fijos en el PDF
            document.getElementById('pdf-nombre-emisor').innerText = nombreEmisor;
            document.getElementById('pdf-cc-emisor').innerText = "CC. " + ccEmisor;
            document.getElementById('pdf-banco-emisor').innerHTML = `Favor consignar el valor en la cuenta de ahorros **${bancoEmisor}** a nombre de ${nombreEmisor}.`;
            document.getElementById('pdf-firma-nombre').innerText = nombreEmisor;
            document.getElementById('pdf-firma-cc').innerText = "C.C. " + ccEmisor;

            // Fecha Actual
            const hoy = new Date();
            const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('fecha-actual').innerText = "Bogotá, " + hoy.toLocaleDateString('es-ES', opciones);

            // Llenar datos del cliente
            document.getElementById('text-empresa').innerText = empresa.toUpperCase();
            document.getElementById('text-nit').innerText = "NIT. " + nit;

            // Construir la tabla y calcular total
            let total = 0;
            let filas = '';
            descs.forEach((d, i) => {
                const v = parseFloat(vals[i].value) || 0;
                total += v;
                if (d.value.trim() !== "" || v > 0) {
                    filas += `<tr>
                        <td class="border border-black p-3">${d.value}</td>
                        <td class="border border-black p-3 text-right">$${v.toLocaleString('es-CO')}</td>
                    </tr>`;
                }
            });

            filas += `<tr class="font-bold bg-gray-50">
                <td class="border border-black p-3 text-right">TOTAL CUENTA DE COBRO</td>
                <td class="border border-black p-3 text-right">$${total.toLocaleString('es-CO')}</td>
            </tr>`;

            document.getElementById('tabla-body').innerHTML = filas;
            document.getElementById('text-total-numero').innerText = "$" + total.toLocaleString('es-CO');
            document.getElementById('text-total-letras').innerText = numeroALetras(total);

            // Exportar PDF
            const element = document.getElementById('factura-template');
            const opt = {
                margin: 0,
                filename: `Cuenta_Cobro_${empresa.replace(/\s+/g, '_')}.pdf`,
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 3, useCORS: true },
                jsPDF: { unit: 'cm', format: 'letter', orientation: 'portrait' }
            };

            // Renderizar
            document.getElementById('pdf-container').classList.remove('hidden');
            html2pdf().set(opt).from(element).save().then(() => {
                document.getElementById('pdf-container').classList.add('hidden');
            });
        }
    </script>
